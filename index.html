<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7ef" />
    <meta name="description" content="A playful pre-trip check-in for traveling well together." />
    <title>Good Company — different ways to travel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" data-action="home" aria-label="Good Company home">
          <span class="brand-mark" aria-hidden="true"><img src="assets/good-company-mark.png" alt="" /></span>
          <span class="brand-wordmark"><strong>good</strong><em>company.</em></span>
        </button>
        <button class="top-action" data-action="sample">Explore a sample <span aria-hidden="true">↗</span></button>
      </header>

      <main id="app" aria-live="polite"></main>

      <footer class="site-footer">
        <span>Different ways to travel. One good way to begin.</span>
        <span class="footer-note">A little check-in, just for this trip.</span>
      </footer>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
